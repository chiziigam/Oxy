name: UI screenshots

on:
  push:
    branches: [ui/coherent-rework]
  workflow_dispatch:

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: ai.oxy.app
      SCREENS: >-
        signin signup onboarding chat-empty chat-thread composer-typing menu now
        your-home activity apps memory vault payments settings delete-account history
    steps:
      - uses: actions/checkout@v4

      - name: Select the latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Find or create an iPhone 16 Pro simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in runtimes:
              for device in devices[runtime]:
                  if device["name"] == "iPhone 16 Pro":
                      print(device["udid"]); sys.exit(0)
          ')
          if [ -z "$UDID" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          r = [x for x in json.load(sys.stdin)["runtimes"] if x["platform"] == "iOS" and x["isAvailable"]]
          print(sorted(r, key=lambda x: x["version"])[-1]["identifier"])
          ')
            UDID=$(xcrun simctl create "iPhone 16 Pro" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$RUNTIME")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulator $UDID"

      - name: Build OxyApp (Debug, simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project OxyApp/OxyApp.xcodeproj \
            -scheme OxyApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=250 -Xfrontend -warn-long-function-bodies=400' \
            build 2>&1 | tee build.log | grep -E "error:|took [0-9]+ms to type-check|\*\* BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Boot and install
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/OxyApp.app
          xcrun simctl privacy "$UDID" grant all "$BUNDLE_ID" || true

      - name: Capture screens in light and dark
        run: |
          mkdir -p screenshots
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            for screen in $SCREENS; do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
              case "$screen" in
                signin|signup|onboarding) autologin=0 ;;
                *) autologin=1 ;;
              esac
              SIMCTL_CHILD_OXY_DEBUG_SCREEN="$screen" \
              SIMCTL_CHILD_OXY_DEBUG_AUTOLOGIN="$autologin" \
                xcrun simctl launch "$UDID" "$BUNDLE_ID" > /dev/null
              sleep 7
              xcrun simctl io "$UDID" screenshot "screenshots/${screen}-${appearance}.png"
              echo "captured ${screen}-${appearance}"
            done
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
